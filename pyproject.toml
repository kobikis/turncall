[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turncall"
version = "1.0.0"
description = "Production voice agent platform - API/Backend"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Validation & Settings
    "jsonschema>=4.21.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Async HTTP
    "httpx>=0.27.0",

    # MCP (Model Context Protocol)
    "mcp>=1.27.0",

    # Redis
    "redis[hiredis]>=5.0.0",

    # Observability
    "loguru>=0.7.0",

    # Security
    "python-jose[cryptography]>=3.3.0",

    # Telephony
    "twilio>=9.0.0",

    # OpenAI (STT/LLM/TTS)
    "openai>=1.30.0",

    # Webhook Signing
    "python-ulid>=2.2.0",

    # Voice Pipeline
    # webrtc-video: the `webrtc` extra's OpenCV dep is deprecated and drops in
    # 2.0.0; video pipelines (avatars over SmallWebRTC) need this extra instead.
    # NOTE: pipecat's "aws" extra is deliberately NOT listed. It pins
    # aiobotocore>=3,<4, while aioboto3 (below, used by the S3 storage adapter)
    # pins aiobotocore==2.25.1 and has no 3.x-compatible release — declaring it
    # makes the project uninstallable. AWSBedrockLLMService works fine on
    # aiobotocore 2.25.1, which aioboto3 already provides. See adr/0016.
    "pipecat-ai[openai,deepgram,elevenlabs,silero,webrtc,webrtc-video,local-smart-turn,google,anthropic,cartesia,heygen,tavus,aws-nova-sonic,tracing]>=1.8.1,<2.0.0",
    # OTLP span exporter (pipecat[tracing] ships otel api/sdk but not an exporter).
    # See ADR-0010.
    "opentelemetry-exporter-otlp>=1.43.0",

    # Knowledge Base (RAG)
    "pgvector>=0.3.0",
    "tiktoken>=0.7.0",
    "pypdf>=4.0.0",
    "aiofiles>=24.1.0",
    "aioboto3>=13.0.0",
    "defusedxml>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "faker>=20.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "bandit>=1.7.5",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/turncall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -ra"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "RUF", # ruff-specific
]
ignore = ["S101", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S314", "B017"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["twilio.*", "redis.*", "boto3.*", "botocore.*", "aioboto3.*", "tiktoken.*", "pypdf.*", "aiofiles.*", "defusedxml.*"]
ignore_missing_imports = true