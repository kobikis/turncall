[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/turncall/__init__.py"

[project]
name = "turncall"
# Single source: src/turncall/__init__.py. Three literals drifted apart before
# this — pyproject said 1.1.0 while the app, and so the published OpenAPI spec,
# announced 0.1.0.
dynamic = ["version"]
description = "Production voice agent platform - API/Backend"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    # Web Framework
    "fastapi>=0.121.0",  # Depends(scope="function")
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Validation & Settings
    "jsonschema>=4.21.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Async HTTP
    "httpx>=0.27.0",

    # MCP (Model Context Protocol)
    # 2.x only, and not by choice: pipecat 1.12's `mcp` extra (taken below)
    # requires mcp[cli]>=2.1.1, so the 1.x line is unreachable from here. The
    # dual-spelling reads mcp_client used to carry for Tool.inputSchema and
    # CallToolResult.isError went with this pin — code that can no longer run
    # is a false claim about what the project supports.
    "mcp>=2.1.1,<3.0.0",

    # Redis
    "redis[hiredis]>=5.0.0",

    # Observability
    "loguru>=0.7.0",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0",

    # Telephony
    "twilio>=9.0.0",

    # OpenAI (STT/LLM/TTS)
    # Floor set by pipecat 1.10; upper bound deliberate rather than absent.
    # openai 3 builds on httpx2 and verifies TLS against the OS trust store
    # instead of certifi — the runtime image carries ca-certificates, so
    # that holds here. Pin <3 to go back to the previous HTTP stack.
    "openai>=1.74.0,<4",

    # Webhook Signing
    "python-ulid>=2.2.0",

    # Voice Pipeline
    # webrtc-video: the `webrtc` extra's OpenCV dep is deprecated and drops in
    # 2.0.0; video pipelines (avatars over SmallWebRTC) need this extra instead.
    # NOTE: pipecat's "aws" extra is deliberately NOT listed. It pins
    # aiobotocore>=3,<4, while aioboto3 (below, used by the S3 storage adapter)
    # pins aiobotocore==2.25.1 and has no 3.x-compatible release — declaring it
    # makes the project uninstallable. AWSBedrockLLMService works fine on
    # aiobotocore 2.25.1, which aioboto3 already provides. See adr/0016.
    # Capped at the next minor (ADR-0028): every pipecat minor is adopted on
    # purpose, its changelog read, never picked up by a fresh install. A minor
    # rewrites internals TurnCall reaches into — 1.13 broke S2S delegation
    # (#367) and ended a call cancelled mid-setup without a recording status.
    "pipecat-ai[openai,deepgram,elevenlabs,silero,webrtc,webrtc-video,local-smart-turn,google,anthropic,cartesia,assemblyai,heygen,tavus,aws-nova-sonic,tracing,mcp]>=1.13.0,<1.14.0",
    # Both arrive through pipecat's local-smart-turn (same ranges). Declared
    # here only so [tool.uv.sources] below can take them from PyTorch's CPU
    # index: PyPI's Linux torch pulls ~2.5GB of CUDA libraries nothing here
    # runs, and uv's sources apply to direct dependencies alone (#377).
    "torch>=2.5.0,<3",
    "torchaudio>=2.5.0,<3",
    # OTLP span exporter (pipecat[tracing] ships otel api/sdk but not an exporter).
    # See ADR-0010.
    "opentelemetry-exporter-otlp>=1.43.0",
    # Ambience ingest (ADR-0021) decodes, resamples and MP3-encodes uploads.
    # Both already arrive through pipecat; declared because we import them.
    "soundfile~=0.13.1",
    "soxr~=1.0.0",

    # Knowledge Base (RAG)
    "pgvector>=0.3.0",
    "tiktoken>=0.7.0",
    "pypdf>=4.0.0",
    "aiofiles>=24.1.0",
    "aioboto3>=13.0.0",
    "defusedxml>=0.7.0",

    # Redaction (ADR-0024, #313): a local PII detector, so no text leaves the
    # deployment to be redacted. Imported only by `services/redaction.py`, and
    # only once a project with redaction on needs it — a project with it off
    # never loads any of this. ~255MB unpacked, ~74MB of the pull.
    # numpy resolves to 2.4.x under these: presidio-analyzer caps it <2.5.
    "presidio-analyzer>=2.2.364,<2.3",
    # Pinned: 2.2.364 caps cryptography <49, and this project (with aiortc and
    # google-auth) resolves cryptography 50. 2.2.362 only needs >=46.0.4.
    "presidio-anonymizer==2.2.362",
    # Declared because we import it (the model check in services/redaction).
    "spacy>=3.8.0,<3.9.0",
    # spaCy's small English model, from its GitHub release (it is not on
    # PyPI). A direct reference so the image, CI and a dev install all carry
    # it at one version: without it Presidio pip-installs the model at
    # runtime, mid-call. Its spacy_version is >=3.8.0,<3.9.0, matching above.
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
# The eval worker is the same image with a different entrypoint. It must never
# run in the API process -- ADR-0004: event-loop jitter becomes dead air on a
# live call, and an eval run is exactly the load that causes it.
turncall-eval-worker = "turncall.evals.worker:main"
# The campaign worker (#229): same image, its own process, for the same reason.
turncall-campaign-worker = "turncall.campaigns.worker:main"
# The website demo (`turncall.demo`): agents from a file over WebRTC, with no
# database, Redis or project — so it runs where the platform cannot.
turncall-demo = "turncall.demo.__main__:main"
# The CLI (#77). An ordinary API client — same key, same endpoints — whose
# exit code is what lets a pull request be gated on agent behaviour.
turncall = "turncall.cli.main:run"

[project.optional-dependencies]
# Audio-modality evals (#72). The caller's voice and the STT the judge reads
# through are pipecat's local defaults, and neither ships with the base
# install: an audio run raises ImportError without them. Kept optional because
# only the eval worker ever needs them — the call path uses the agent's own
# configured providers.
evals-audio = [
    "pipecat-ai[kokoro,moonshine]>=1.13.0,<1.14.0",
]
# A `jev` judge (#141). TypeSafe is a vendor no live call ever contacts, so the
# base install does not carry it — only the eval worker (and a `jev` live test)
# ever builds one. Needs TYPESAFE_API_KEY; a run naming `jev` without either
# fails saying which of the two is missing. pipecat's own extra is `typesafe`
# since 1.13 (`jev` is its deprecated alias, #375); ours keeps its name, since
# images and installs already ask for it.
evals-jev = [
    "pipecat-ai[typesafe]>=1.13.0,<1.14.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.6.0",
    "faker>=20.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "bandit>=1.7.5",
    "httpx>=0.27.0",
]

# The en_core_web_sm model above is a direct URL reference, which hatchling
# refuses without this. The engine is not published to PyPI, whose ban on
# direct references would otherwise apply.
[tool.hatch.metadata]
allow-direct-references = true

# CPU-only torch everywhere uv.lock is installed: the image, CI and `uv sync`.
# `explicit`: nothing else is ever taken from this index. It carries macOS
# wheels too, so the lock needs no platform marker. pip ignores this table,
# so a plain `pip install -e .` on Linux still gets PyPI's CUDA build.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/turncall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# `not live` by default: the live suite talks to real providers and costs
# real money. Run it deliberately with `pytest -m live`.
addopts = "--strict-markers -ra -m 'not live'"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    # Real providers, real sockets, real money. Skipped without credentials so
    # CI stays hermetic; run them by hand when a dependency moves underneath us.
    "live: hits a third-party service (needs credentials)",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "RUF", # ruff-specific
]
# E501 (line-too-long) is the formatter's job, not the linter's: `ruff format`
# holds the 88-column width above, and the lines it can't break — long string
# literals, URLs, comments — are ones no linter error helps with either.
ignore = ["S101", "S104", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S314", "B017"]
# IPA symbols are ambiguous with ASCII look-alikes by definition — that is
# what these files are about. Flagging every one of them says nothing.
"src/turncall/domain/ipa.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_tts_pronunciations.py" = ["RUF001", "RUF002", "RUF003"]
"src/turncall/orchestrator/config_warnings.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_agent_config_warnings.py" = ["RUF001", "RUF002", "RUF003"]
"tests/live/test_live_tts_pronunciations.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["twilio.*", "redis.*", "boto3.*", "botocore.*", "aioboto3.*", "tiktoken.*", "pypdf.*", "aiofiles.*", "defusedxml.*", "soundfile.*", "soxr.*", "presidio_analyzer.*", "presidio_anonymizer.*", "spacy.*"]
ignore_missing_imports = true