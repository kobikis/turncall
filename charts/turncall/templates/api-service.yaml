apiVersion: v1
kind: Service
metadata:
  name: {{ include "turncall.fullname" . }}
  labels:
    {{- include "turncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "turncall.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
