{{- if .Values.evalWorker.enabled }}
{{- $longestRun := max .Values.evals.maxRunDurationSeconds (mul 180 .Values.evals.maxIterations) }}
# ADR-0018: the eval worker is never the API process. An eval run's load in
# the API's event loop becomes dead air on a live call.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "turncall.fullname" . }}-eval-worker
  labels:
    {{- include "turncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: eval-worker
spec:
  replicas: {{ .Values.evalWorker.replicas }}
  selector:
    matchLabels:
      {{- include "turncall.selectorLabels" (dict "ctx" . "component" "eval-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "turncall.selectorLabels" (dict "ctx" . "component" "eval-worker") | nindent 8 }}
      annotations:
        {{- include "turncall.configChecksum" . | nindent 8 }}
    spec:
      {{- include "turncall.podSpec" . | trim | nindent 6 }}
      # On SIGTERM the worker stops taking runs and finishes the ones it holds.
      # The longest a run may take is the janitor's arithmetic:
      # max(EVAL_MAX_RUN_DURATION_SECONDS, 180s x EVAL_MAX_ITERATIONS) + 60s.
      # A run killed sooner is not lost — the janitor marks it errored.
      terminationGracePeriodSeconds: {{ add $longestRun 60 }}
      {{- with include "turncall.scheduling" .Values.evalWorker | trim }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: eval-worker
          image: {{ include "turncall.image" (dict "ctx" . "override" .Values.evalWorker.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["turncall-eval-worker"]
          {{- include "turncall.env" . | nindent 10 }}
          env:
            - name: TURNCALL_ENV
              value: production
          {{- with .Values.evalWorker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
