{{- range list "EVAL_MAX_ITERATIONS" "EVAL_MAX_RUN_DURATION_SECONDS" }}
{{- if hasKey $.Values.config . }}
{{- fail (printf "set %s through evals.*, not config: it also sizes the eval worker's grace period" .) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "turncall.fullname" . }}
  labels:
    {{- include "turncall.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- with (.Values.global).publicBaseUrl }}
  {{- if not (hasKey $.Values.config "PUBLIC_BASE_URL") }}
  PUBLIC_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- end }}
  EVAL_MAX_ITERATIONS: {{ .Values.evals.maxIterations | quote }}
  EVAL_MAX_RUN_DURATION_SECONDS: {{ .Values.evals.maxRunDurationSeconds | quote }}
