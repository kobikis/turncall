{{- if .Values.asteriskEdge.enabled }}
# The ARI edge (#209): ARI gives an app's calls to the newest WebSocket only,
# and the one it replaced never gets them back. So one process, never two:
# one replica, never autoscaled, and Recreate, so a rollout stops the old pod
# before the new one connects. Overlapping them would hand the new pod the
# events of calls only the old one knows, and their two legs would no longer
# be hung up together.
#
# Not behind the Service: the edge connects out to Asterisk, and each call's
# media stream lands on the API pods. It carries no media itself, so it has
# no calls to drain and exits on SIGTERM once its webhooks are out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "turncall.fullname" . }}-asterisk-edge
  labels:
    {{- include "turncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: asterisk-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "turncall.selectorLabels" (dict "ctx" . "component" "asterisk-edge") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "turncall.selectorLabels" (dict "ctx" . "component" "asterisk-edge") | nindent 8 }}
      annotations:
        {{- include "turncall.configChecksum" . | nindent 8 }}
    spec:
      {{- include "turncall.podSpec" . | trim | nindent 6 }}
      # No calls of its own; post-call webhook delivery gets its 60s.
      terminationGracePeriodSeconds: 90
      {{- with include "turncall.scheduling" .Values.asteriskEdge | trim }}{{ . | nindent 6 }}{{ end }}
      {{- with include "turncall.waitForMigrations" . | trim }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: asterisk-edge
          image: {{ include "turncall.image" (dict "ctx" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "turncall.env" . | nindent 10 }}
          env:
            - name: TURNCALL_ENV
              value: production
            - name: PORT
              value: "8090"
            - name: ASTERISK_EDGE_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8090
          livenessProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 2
            failureThreshold: 60
          {{- with .Values.asteriskEdge.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
