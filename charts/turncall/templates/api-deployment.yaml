{{- $grace := add .Values.api.preStopSeconds .Values.maxCallDurationSeconds 90 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "turncall.fullname" . }}-api
  labels:
    {{- include "turncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "turncall.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  # A replaced pod drains for as long as its longest call; bring the new one up
  # first so capacity never dips during a rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "turncall.selectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        {{- include "turncall.configChecksum" . | nindent 8 }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: /metrics
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "turncall.podSpec" . | trim | nindent 6 }}
      # preStop + the longest call + the drain's own 90s (#199): SIGKILL at the
      # end of this drops whatever calls remain.
      terminationGracePeriodSeconds: {{ $grace }}
      {{- with include "turncall.scheduling" .Values.api | trim }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: api
          image: {{ include "turncall.image" (dict "ctx" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "turncall.env" . | nindent 10 }}
          env:
            - name: TURNCALL_ENV
              value: production
            - name: PORT
              value: "8090"
            # Exactly one process holds Asterisk's ARI connection: the
            # asterisk-edge Deployment, never a replica of this one.
            - name: ASTERISK_EDGE_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 8090
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.api.preStopSeconds }}"]
          # /ready fails from the first SIGTERM, so the pod leaves the
          # Service's endpoints while it drains.
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 1
          # /live stays 200 while draining. Never /ready (it fails on purpose
          # while draining) or /health (a database blip would restart every
          # pod and drop every call).
          livenessProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 2
            failureThreshold: 60
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
