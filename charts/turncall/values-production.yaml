# A production install, as a starting point: your own Postgres (with the
# `vector` extension) and Redis, S3 for files, an Ingress with TLS, and
# secrets in a Secret you manage. Copy it, replace every example.com and
# placeholder, and install:
#
#   kubectl create secret generic turncall-env \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://turncall:...@db.example.com:5432/turncall' \
#     --from-literal=REDIS_URL='rediss://:...@redis.example.com:6379/0' \
#     --from-literal=PLATFORM_API_KEY='...' \
#     --from-literal=API_KEY_HASH_SECRET='...' \
#     --from-literal=CREDENTIAL_ENCRYPTION_KEY='...' \
#     --from-literal=OPENAI_API_KEY='...' --from-literal=DEEPGRAM_API_KEY='...' \
#     --from-literal=TWILIO_ACCOUNT_SID='...' --from-literal=TWILIO_AUTH_TOKEN='...'
#   helm install turncall charts/turncall -n turncall -f my-production-values.yaml
#
# API_KEY_HASH_SECRET and CREDENTIAL_ENCRYPTION_KEY: set once, never rotate
# (CLAUDE.md "Environment Variables"). docs/guides/kubernetes.mdx.

image:
  repository: ghcr.io/kobikis/turncall
  # Pin a release: the drain the grace periods are sized for is in releases
  # after 2.0.0.
  tag: "2.0.0"
# The registry login, if the image is private:
#   kubectl create secret docker-registry ghcr --docker-server=ghcr.io ...
imagePullSecrets: []
  # - name: ghcr

global:
  # The host the Ingress below serves. Twilio/Telnyx webhooks and media
  # streams come here.
  publicBaseUrl: https://turncall.example.com

# Every secret setting, as environment variables. It must hold DATABASE_URL
# (the migration Job reads it from there).
existingSecret: turncall-env

config:
  STORAGE_BACKEND: s3
  S3_BUCKET_NAME: turncall-example-recordings
  AWS_REGION: us-east-1
  # Credentials for S3 come from the pod's identity (IRSA, workload
  # identity) or AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in the Secret.
  # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318

# Your agents' longest max_call_duration_seconds: it sizes the API's grace
# period, and a pod is killed at the end of it.
maxCallDurationSeconds: 3600

api:
  replicas: 2

# Scale on live calls per pod; needs prometheus-adapter serving
# turncall_active_calls (docs/guides/kubernetes.mdx, "Autoscaling").
autoscaling:
  enabled: false

ingress:
  enabled: true
  className: nginx
  annotations:
    # Media streams are WebSockets that last a whole call: at least
    # maxCallDurationSeconds.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3700"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3700"
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: turncall.example.com
  tls:
    - secretName: turncall-tls
      hosts: [turncall.example.com]

# With prometheus-operator: scrape every API pod's /metrics.
podMonitor:
  enabled: false
