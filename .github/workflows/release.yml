name: Release

on:
  push:
    # Both forms: this repo's five prior releases are tagged bare (0.5.0), while
    # "v0.9.0" is the more common convention. Matching only one would let a
    # release tag land and silently build nothing.
    tags: ["v[0-9]*", "[0-9]*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.9.0 -> :0.9.0, :0.9, :latest. Self-hosters pin the exact version;
          # :latest exists for the quickstart.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only: the image carries torch + onnxruntime, and cross-building
          # that under QEMU takes hours. Revisit with native arm64 runners.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
