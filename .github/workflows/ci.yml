name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks only — no pipecat install, so this fails in ~20s instead of
  # waiting on the 1.8GB dependency tree the test job needs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned ruff turns every upstream release into a red build
      # on code nobody touched. Bump deliberately.
      - run: pip install ruff==0.15.18
      - run: ruff check src/ tests/

  # CONTRIBUTING.md requires a DCO sign-off; enforce it rather than just asking.
  # Plain bash so there is no third-party action in the supply chain.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Check commits are signed off
        run: |
          # Use the branch tip, not HEAD: actions/checkout resolves a PR to a
          # synthetic merge commit that carries no sign-off of its own.
          # --no-merges likewise spares a contributor's own merge commits.
          head='${{ github.event.pull_request.head.sha }}'
          base=$(git merge-base origin/${{ github.base_ref }} "$head")
          missing=$(git log --no-merges --format='%H %s' \
            --invert-grep --grep='^Signed-off-by: .\+ <.\+@.\+>$' "$base".."$head")
          if [ -n "$missing" ]; then
            echo "::error::Commits missing a Signed-off-by trailer:"
            echo "$missing"
            echo "Fix with: git commit --amend -s   (or git rebase --signoff $base)"
            exit 1
          fi
          echo "All commits signed off."

  test:
    runs-on: ubuntu-latest
    services:
      # pgvector, not stock postgres: the knowledge-base migration runs
      # `CREATE EXTENSION IF NOT EXISTS vector`. Matches localstack/docker-compose.yml.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: turncall
          POSTGRES_PASSWORD: turncall
          POSTGRES_DB: turncall
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://turncall:turncall@localhost:5432/turncall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Only the sequence-number race test needs a live DB; it self-skips
      # without one, so migrating is what keeps it from silently not running.
      - run: alembic upgrade head
      - run: pytest --cov=src/turncall --cov-report=term-missing
      - run: bandit -r src/ --severity-level high
