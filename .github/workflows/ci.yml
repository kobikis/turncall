name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks only — no pipecat install, so this fails in ~20s instead of
  # waiting on the 1.8GB dependency tree the test job needs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned ruff turns every upstream release into a red build
      # on code nobody touched. Bump deliberately.
      - run: pip install ruff==0.15.18
      # examples/ included: it is the code users copy first, and it went
      # unlinted long enough to accumulate errors nobody saw.
      - run: ruff check src/ tests/ examples/
      # The width lives in one place. Without this the tree drifts back off
      # the formatter and the next person's diff carries a reflow of files
      # they never opened — which is how the 100/88 mismatch went unnoticed.
      - run: ruff format --check src/ tests/ examples/

  # CONTRIBUTING.md requires a DCO sign-off; enforce it rather than just asking.
  # Plain bash so there is no third-party action in the supply chain.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Check commits are signed off
        run: |
          # Use the branch tip, not HEAD: actions/checkout resolves a PR to a
          # synthetic merge commit that carries no sign-off of its own.
          # --no-merges likewise spares a contributor's own merge commits.
          head='${{ github.event.pull_request.head.sha }}'
          base=$(git merge-base origin/${{ github.base_ref }} "$head")
          missing=$(git log --no-merges --format='%H %s' \
            --invert-grep --grep='^Signed-off-by: .\+ <.\+@.\+>$' "$base".."$head")
          if [ -n "$missing" ]; then
            echo "::error::Commits missing a Signed-off-by trailer:"
            echo "$missing"
            echo "Fix with: git commit --amend -s   (or git rebase --signoff $base)"
            exit 1
          fi
          echo "All commits signed off."

  # Build the image on every PR, without pushing. release.yml only builds on a
  # tag, so before this the first build of a Dockerfile change happened after
  # the tag was already public — which is exactly how the 1.0.0 build failed.
  # Same platform and cache as the release build, so a green run here means the
  # release build will get that far too.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships ~14GB free and preinstalls toolchains we never use.
      # The pipecat dependency tree (torch, CUDA wheels, awscrt, smithy) plus a
      # pip cache now lands close enough to that ceiling that a run failed with
      # 53MB left. Reclaiming these takes a few seconds and buys ~13GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost
          df -h / | tail -1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest
    services:
      # pgvector, not stock postgres: the knowledge-base migration runs
      # `CREATE EXTENSION IF NOT EXISTS vector`. Matches localstack/docker-compose.yml.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: turncall
          POSTGRES_PASSWORD: turncall
          POSTGRES_DB: turncall
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # A live call's control channel (#215) and the limits (#206) live in
      # Redis; the harness and limits tests that prove them skip without one.
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://turncall:turncall@localhost:5432/turncall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # uv installs the tree in a fraction of pip's time, from a cache keyed on
      # pyproject.toml. setup-uv publishes no moving major tag (`@v10` does not
      # resolve), so it is pinned to the release's commit.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      # CPU-only torch first, as the Dockerfile does: otherwise the resolve pulls
      # the Linux CUDA build (torch + nvidia-* wheels, ~2.5GB of GPU libraries
      # nothing here runs). That build is what used to fill the runner's disk
      # and need a "free disk space" step; without it there is room to spare.
      - run: uv pip install --system --index-url https://download.pytorch.org/whl/cpu torch torchaudio
      - run: uv pip install --system -e ".[dev]"
      # docs/openapi.json is generated from the app and copied into the
      # turncall-skill repo by `make sync-skill`, so a stale spec silently
      # misdocuments the API for everyone downstream. Runs here rather than in
      # `lint` because generating it imports the app.
      - run: make check-openapi
      # The reference lists its pages by hand, so a shipped endpoint is only
      # published if someone adds one. Twelve eval routes were missing and the
      # docs read as complete throughout — a missing page looks exactly like a
      # feature nobody wrote. Runs after the spec check, which it reads.
      - run: make check-docs-nav
      # Only the sequence-number race test needs a live DB; it self-skips
      # without one, so migrating is what keeps it from silently not running.
      - run: alembic upgrade head
      # sys.monitoring (Python 3.12+) measures line coverage at a fraction of
      # the settrace tracer's overhead. One worker per core, each with a
      # database and a Redis database of its own (tests/conftest.py); most of
      # the integration time is calls running in real time, so they overlap.
      - run: pytest -n auto --dist worksteal --cov=src/turncall --cov-report=term-missing
        env:
          COVERAGE_CORE: sysmon
      - run: bandit -r src/ --severity-level high
